<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure CCTV Audit System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sticky-col { position: sticky; left: 0; background: #f8fafc; z-index: 10; border-right: 2px solid #e2e8f0; }
        .check-cell { min-width: 100px; text-align: center; border: 1px solid #e2e8f0; }
        .tab-btn.active { border-bottom: 3px solid #fff; font-weight: bold; }
        #auth-screen { transition: all 0.5s ease-in-out; }
        .hidden { display: none !important; }
        .state-btn { width: 24px; height: 24px; border-radius: 4px; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; transition: all 0.2s; background: white; margin: 0 auto; }
        .state-ok { background: #dcfce7; color: #166534; border-color: #86efac; }
        .state-fail { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-indigo-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-black text-indigo-700 mb-2">CCTV SECURE</h2>
            <p class="text-slate-500 mb-6 text-sm">Authentication Required</p>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="admin@company.com">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password</label>
                    <input type="password" id="loginPass" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition uppercase tracking-widest">Login to App</button>
                <p id="loginError" class="text-red-500 text-xs text-center hidden"></p>
            </div>
        </div>
    </div>

    <main id="main-app" class="hidden">
        <nav class="bg-indigo-700 text-white shadow-xl sticky top-0 z-50">
            <div class="max-w-full mx-auto px-6 py-3 flex flex-wrap justify-between items-center">
                <div class="flex items-center space-x-6">
                    <h1 class="text-xl font-black tracking-tighter">CCTV <span class="text-indigo-200">AUDIT</span></h1>
                    <div class="flex bg-indigo-800 rounded-lg p-1">
                        <button onclick="showTab('checksheet')" class="tab-btn active px-4 py-1 text-sm">Checksheet</button>
                        <button onclick="verifyAdminAccess()" class="tab-btn px-4 py-1 text-sm">Admin Dashboard</button>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="exportToCSV()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 shadow-lg transition transform active:scale-95">
                        <span class="text-lg">💾</span> SAVE DATA BACKUP
                    </button>
                    <input type="month" id="globalDate" onchange="loadNewDate()" class="bg-indigo-600 border-none text-white text-sm font-bold rounded px-2 py-1 outline-none cursor-pointer">
                    <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-xs font-bold transition">LOGOUT</button>
                </div>
            </div>
        </nav>

        <section id="tab-checksheet" class="p-4 space-y-4">
            <div class="max-w-md mx-auto">
                <input type="text" id="checksheetSearch" onkeyup="renderChecksheet()" placeholder="🔍 Search Camera ID or Location..." class="w-full border-2 border-indigo-200 p-2 rounded-xl text-sm outline-none focus:border-indigo-500 shadow-sm">
            </div>

            <div class="bg-white shadow-2xl rounded-xl overflow-hidden border border-slate-200">
                <div class="overflow-x-auto overflow-y-auto max-h-[75vh]">
                    <table id="auditTable" class="w-full text-[11px] text-left border-collapse">
                        <thead id="table-head" class="bg-slate-200 text-slate-600 sticky top-0 z-20"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tab-admin" class="hidden p-6 max-w-6xl mx-auto space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-green-500">
                <h2 class="text-lg font-bold mb-4">Manage Camera Assets</h2>
                <div class="mb-4"><input type="text" id="adminCamSearch" onkeyup="renderAdminLists()" placeholder="🔍 Filter list..." class="w-full border p-2 rounded-lg text-sm bg-slate-50 outline-none"></div>
                <div class="space-y-3 mb-6 bg-slate-50 p-4 rounded-lg">
                    <input type="text" id="camId" placeholder="Asset No" class="w-full border p-2 rounded">
                    <input type="text" id="camLoc" placeholder="Location" class="w-full border p-2 rounded">
                    <button onclick="saveCamera()" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700">SAVE CAMERA</button>
                </div>
                <ul id="camera-list" class="space-y-2 overflow-y-auto max-h-64"></ul>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-500">
                <h2 class="text-lg font-bold mb-4">Manage Checkpoints</h2>
                <div class="flex gap-2 mb-6 bg-slate-50 p-4 rounded-lg">
                    <input type="text" id="pointName" placeholder="Checkpoint Name" class="flex-grow border p-2 rounded">
                    <button onclick="savePoint()" class="bg-blue-600 text-white px-6 rounded font-bold">+</button>
                </div>
                <ul id="points-list" class="space-y-2 overflow-y-auto max-h-64"></ul>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC53SyOf8S1qUMWCUR8PxWOLL1jdENMkqk",
            authDomain: "cctv-online-checksheet.firebaseapp.com",
            databaseURL: "https://cctv-online-checksheet-default-rtdb.firebaseio.com",
            projectId: "cctv-online-checksheet",
            storageBucket: "cctv-online-checksheet.firebasestorage.app",
            messagingSenderId: "823455470476",
            appId: "1:823455470476:web:419a445f890095a8c37ca9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Core Functions
        window.handleLogin = () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert("Login Failed"));
        };
        window.handleLogout = () => signOut(auth);
        onAuthStateChanged(auth, (user) => {
            if (user) { document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden'); initApp(); }
            else { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('main-app').classList.add('hidden'); }
        });
        window.verifyAdminAccess = () => {
            const confirmPass = prompt("ADMIN SECURITY: Re-enter password:");
            if (confirmPass) signInWithEmailAndPassword(auth, auth.currentUser.email, confirmPass).then(() => showTab('admin')).catch(() => alert("Access denied."));
        };

        let cameras = {};
        let checkpoints = [];
        const dateInput = document.getElementById('globalDate');
        if(!dateInput.value) dateInput.value = new Date().toISOString().slice(0, 7);

        function initApp() {
            onValue(ref(db, 'config'), (snapshot) => {
                const config = snapshot.val() || { cameras: {}, points: {} };
                cameras = config.cameras || {};
                checkpoints = Object.entries(config.points || {}).map(([id, val]) => ({id, val}));
                renderAdminLists();
                renderChecksheet();
            });
        }

        window.showTab = (tab) => {
            document.getElementById('tab-checksheet').classList.toggle('hidden', tab !== 'checksheet');
            document.getElementById('tab-admin').classList.toggle('hidden', tab !== 'admin');
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tab === 'checksheet');
            btns[1].classList.toggle('active', tab === 'admin');
        };

        window.loadNewDate = () => renderChecksheet();

        // Database Setters
        window.saveCamera = () => {
            const id = document.getElementById('camId').value.trim();
            const loc = document.getElementById('camLoc').value.trim();
            if(id && loc) { set(ref(db, `config/cameras/${id}`), loc); document.getElementById('camId').value = ''; document.getElementById('camLoc').value = ''; }
        };
        window.deleteCamera = (id) => { if(confirm("Delete?")) remove(ref(db, `config/cameras/${id}`)); };
        window.savePoint = () => {
            const name = document.getElementById('pointName').value.trim();
            if(name) { set(ref(db, `config/points/${Date.now()}`), name); document.getElementById('pointName').value = ''; }
        };
        window.deletePoint = (id) => remove(ref(db, `config/points/${id}`));
        window.updateCheckState = (c, p, d, currentState) => {
            let nextState = (currentState === "" || !currentState) ? "ok" : (currentState === "ok" ? "fail" : "");
            set(ref(db, `data/${dateInput.value}/checks/${c}/${p}/${d}`), nextState);
        };
        window.updateRemark = (path, v) => set(ref(db, `data/${dateInput.value}/remarks/${path}`), v);

        // BACKUP EXPORT LOGIC
        window.exportToCSV = () => {
            // Include all cameras for a full backup, regardless of search filter
            const allCams = Object.entries(cameras);
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Header
            let headers = ["DATE (DD-MM-YYYY)", "SR NO", "CAMERA ID", "LOCATION"];
            checkpoints.forEach(p => headers.push(p.val.toUpperCase()));
            headers.push("SPECIFIC CAMERA REMARK", "GENERAL DAILY REMARK");
            csvContent += headers.join(",") + "\n";

            onValue(ref(db, `data/${dateInput.value}`), (snap) => {
                const data = snap.val() || {};
                const currentMonth = dateInput.value;

                for (let d = 1; d <= 31; d++) {
                    const formattedDay = d.toString().padStart(2, '0');
                    allCams.forEach(([camId, loc], idx) => {
                        let row = [`${formattedDay}-${currentMonth}`, idx + 1, camId, loc.replace(/,/g, " ")];
                        
                        // Checkpoints Status
                        checkpoints.forEach(p => {
                            let status = data.checks?.[camId]?.[p.id]?.[d] || "NOT CHECKED";
                            row.push(status.toUpperCase());
                        });

                        // Remarks
                        let camRemark = (data.remarks?.[`${camId}-${d}`] || "").replace(/,/g, " ");
                        let dayRemark = idx === 0 ? (data.remarks?.[`day-${d}`] || "").replace(/,/g, " ") : "";
                        
                        row.push(camRemark, dayRemark);
                        csvContent += row.map(v => `"${v}"`).join(",") + "\n";
                    });
                }
                
                // Trigger Download
                const today = new Date().toLocaleDateString().replace(/\//g, "-");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `CCTV_Backup_${currentMonth}_Exported_${today}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, { onlyOnce: true });
        };

        window.renderChecksheet = () => {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const query = document.getElementById('checksheetSearch').value.toLowerCase();
            const filteredCams = Object.entries(cameras).filter(([id, loc]) => id.toLowerCase().includes(query) || loc.toLowerCase().includes(query));

            if (filteredCams.length === 0) {
                body.innerHTML = '<tr><td colspan="50" class="p-10 text-center">No cameras match search.</td></tr>';
                return;
            }

            let ptsHead = checkpoints.map(p => `<th class="p-3 border min-w-[110px] bg-slate-200 text-center">${p.val}</th>`).join('');
            head.innerHTML = `<tr class="uppercase">
                <th class="p-3 border sticky-col z-30 bg-slate-200 text-center" style="left:0; width:60px;">Date</th>
                <th class="p-3 border sticky-col z-30 bg-slate-200 min-w-[170px]" style="left:60px">Asset Details</th>
                ${ptsHead}
                <th class="p-3 border min-w-[150px]">Camera Remark</th>
                <th class="p-3 border min-w-[150px]">Daily Remark</th>
            </tr>`;

            let bodyHtml = '';
            for (let d = 1; d <= 31; d++) {
                filteredCams.forEach(([camId, loc], idx) => {
                    bodyHtml += `<tr class="border-b hover:bg-slate-50 transition">`;
                    if (idx === 0) bodyHtml += `<td rowspan="${filteredCams.length}" class="p-3 border sticky-col bg-indigo-50 text-center font-black text-indigo-700" style="left:0">${d}</td>`;
                    
                    bodyHtml += `<td class="p-3 border sticky-col bg-white font-bold text-slate-700 text-[10px]" style="left:60px">
                        <div class="flex flex-col">
                            <span class="text-indigo-600 font-black">${camId}</span>
                            <span class="text-[8px] text-slate-400 uppercase truncate">${loc}</span>
                        </div>
                    </td>`;
                    
                    checkpoints.forEach(p => {
                        bodyHtml += `<td class="check-cell p-2">
                            <button class="state-btn" data-path="${camId}-${p.id}-${d}" data-state="" onclick="updateCheckState('${camId}','${p.id}',${d},this.dataset.state)"></button>
                        </td>`;
                    });

                    bodyHtml += `<td class="p-2 border">
                        <input type="text" onchange="updateRemark('${camId}-${d}', this.value)" data-rem="${camId}-${d}" placeholder="Camera issue..." class="w-full text-[10px] p-1 border rounded outline-none focus:border-indigo-400">
                    </td>`;

                    if (idx === 0) bodyHtml += `<td rowspan="${filteredCams.length}" class="p-2 border bg-slate-50"><textarea onchange="updateRemark('day-${d}', this.value)" data-rem="day-${d}" placeholder="Shift general notes..." class="text-[10px] border p-2 h-full min-h-[40px] w-full rounded outline-none focus:bg-white"></textarea></td>`;
                    bodyHtml += `</tr>`;
                });
                bodyHtml += `<tr class="bg-slate-300 h-1"><td colspan="${checkpoints.length + 4}"></td></tr>`;
            }
            body.innerHTML = bodyHtml;

            // Sync States from Firebase
            onValue(ref(db, `data/${dateInput.value}`), (snap) => {
                const data = snap.val() || {};
                document.querySelectorAll('.state-btn').forEach(btn => {
                    const [c, p, d] = btn.dataset.path.split('-');
                    const val = data.checks?.[c]?.[p]?.[d] || "";
                    btn.dataset.state = val;
                    btn.className = "state-btn " + (val === "ok" ? "state-ok" : val === "fail" ? "state-fail" : "");
                    btn.innerHTML = (val === "ok" ? "✓" : val === "fail" ? "✕" : "");
                });
                document.querySelectorAll('textarea, input[data-rem]').forEach(el => el.value = data.remarks?.[el.dataset.rem] || '');
            });
        }

        window.renderAdminLists = () => {
            const query = document.getElementById('adminCamSearch').value.toLowerCase();
            document.getElementById('camera-list').innerHTML = Object.entries(cameras).filter(([id, loc]) => id.toLowerCase().includes(query) || loc.toLowerCase().includes(query)).map(([id, loc]) => `<li class="flex justify-between items-center p-3 bg-white shadow-sm rounded-lg border text-xs"><span><b>${id}</b>: ${loc}</span><button onclick="deleteCamera('${id}')" class="text-red-500 font-bold bg-red-50 px-2 py-1 rounded">DELETE</button></li>`).join('');
            document.getElementById('points-list').innerHTML = checkpoints.map(p => `<li class="flex justify-between items-center p-3 bg-white shadow-sm rounded-lg border text-xs"><span>${p.val}</span><button onclick="deletePoint('${p.id}')" class="text-red-500 font-bold bg-red-50 px-2 py-1 rounded">DELETE</button></li>`).join('');
        };
    </script>
</body>
</html>
